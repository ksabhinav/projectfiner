name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege at the top level; the deploy job escalates for itself.
permissions:
  contents: read

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Test, validate, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit and contract tests
        run: npm test

      - name: Validate SLBC data against exact waivers
        # Every legacy critical finding has an observation-level fingerprint.
        # Any new identity fails even if another issue was fixed in the same
        # state/type bucket; the waiver ledger also has a mandatory expiry.
        run: npm run check:data-quality

      - name: Validate public release distributions
        # Structural delivery defects are never baselined: malformed CSV,
        # invalid JSON, unsafe paths, BOMs, or integrity drift block release.
        run: |
          npm run check:meghalaya-contract
          npm run check:release-manifest
          npm run check:release-data

      - name: Build Astro site
        run: npm run build

      - name: Validate built pages, links, metadata, and sitemap
        run: npm run check:site

      - name: Generate dependency SBOM
        run: npm sbom --sbom-format cyclonedx > dependency-sbom.cdx.json

      - name: Upload dependency SBOM
        uses: actions/upload-artifact@v4
        with:
          name: dependency-sbom-${{ github.sha }}
          path: dependency-sbom.cdx.json
          retention-days: 30

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  dependency-review:
    name: Review dependency changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Block newly introduced high-severity dependencies
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  deploy:
    needs: quality
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Deploy is the only job that needs Pages + OIDC credentials.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
