name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege at the top level; the deploy job escalates for itself.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    # Gate: data must be regression-free before it can ship. Astro treats
    # public/**/*.json as static assets, so semantically corrupt data (unit
    # errors, cross-state contamination, column shifts) builds cleanly and
    # would deploy. This is the only step that inspects the data itself.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate SLBC data against exact waivers
        # Every legacy critical finding has an observation-level fingerprint.
        # Any new identity fails even if another issue was fixed in the same
        # state/type bucket; the waiver ledger also has a mandatory expiry.
        run: python3 validate_data.py --waivers .github/validation-waivers

      - name: Validate public release distributions
        # Structural delivery defects are never baselined: malformed CSV,
        # invalid JSON, unsafe paths, BOMs, or integrity drift block release.
        run: |
          python3 db/build_meghalaya_standardized.py --check
          python3 db/build_release_manifest.py --check
          python3 db/validate_release_data.py

      - name: Upload validation provenance
        uses: actions/upload-artifact@v4
        with:
          name: validation-provenance
          path: public/data-quality/validation-summary.json

  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download validation provenance
        uses: actions/download-artifact@v4
        with:
          name: validation-provenance
          path: public/data-quality

      - name: Build Astro site
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Deploy is the only job that needs Pages + OIDC credentials.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
